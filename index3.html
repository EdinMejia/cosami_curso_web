<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Catálogo Interactivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light"> 
    <header class="mb-4">
        <h1>💻 TechStore Catalog</h1>
        <p>Encuentra los mejores componentes y accesorios para tu setup.</p>
    </header>

    <main class="container-fluid px-0">
        <!-- Spinner de Carga (Requisito UX) -->
        <div id="loadingSpinner" class="spinner-border text-primary d-none mb-3" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <!-- Módulo Administrador: Gestión de Inventario (Requisito Lab) -->
        <section class="mb-4 p-3 border rounded bg-white shadow-sm">
            <h2>🛠️ Módulo Administrador (Alta de Productos)</h2>
            <form id="formProducto" class="row g-2 mt-2">
                <div class="col-md-3"><input type="text" id="prodNombre" class="form-control" placeholder="Nombre del producto" required></div>
                <div class="col-md-2"><input type="number" id="prodPrecio" step="0.01" class="form-control" placeholder="Precio ($)" required></div>
                <div class="col-md-2">
                    <select id="prodCategoria" class="form-select" required>
                        <option value="" disabled selected>Categoría...</option>
                        <option value="Periféricos">Periféricos</option>
                        <option value="Pantallas">Pantallas</option>
                        <option value="Audio">Audio</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>
                <div class="col-md-2"><input type="number" id="prodStock" class="form-control" placeholder="Stock" required></div>
                <div class="col-md-3"><button type="submit" class="btn btn-dark w-100">Crear Producto en Firebase</button></div>
            </form>
        </section>

        <!-- Buscador y Filtro (Original) -->
        <section class="mb-4 p-3 border rounded bg-white shadow-sm">
            <label for="searchInput" class="fw-bold">Buscar producto:</label>
            <input type="text" id="searchInput" placeholder="Ej. Teclado, Monitor..." class="form-control mb-2 w-50 d-inline-block">
            
            <label for="categoryFilter" class="fw-bold ms-3">Filtrar por categoría:</label>
            <select id="categoryFilter" class="form-select w-auto d-inline-block">
                <option value="Todos">Todos</option>
                <option value="Periféricos">Periféricos</option>
                <option value="Pantallas">Pantallas</option>
                <option value="Audio">Audio</option>
                <option value="Accesorios">Accesorios</option>
            </select>
        </section>
        
        <!-- Catálogo Dinámico -->
        <section class="mb-4">
            <h2>Productos Disponibles</h2>
            <div id="productsContainer" class="d-flex flex-wrap gap-3 mt-3">
                <!-- Se inyectan las tarjetas desde Firebase -->
            </div>
        </section>
        
        <!-- Módulo de Comercio: Carrito y Checkout -->
        <section class="p-3 border rounded bg-white shadow-sm mb-5">
            <h2>🛒 Tu Carrito en la Nube</h2>
            <ul id="cartList" class="list-group mb-3 mt-3">
                <li class="list-group-item">El carrito está vacío</li>
            </ul>
            <p class="fs-4 fw-bold">Total: $<span id="cartTotal">0.00</span></p>
            <div class="d-flex gap-2">
                <!-- Botón Original Vaciar Carrito -->
                <button id="clearCartBtn" class="btn btn-warning">Vaciar Carrito</button>
                <!-- Botón Nuevo Finalizar Compra (Requisito Lab) -->
                <button id="btnFinalizarCompra" class="btn btn-success">Finalizar Compra</button>
            </div>
        </section>
    </main>

    <!-- Toast Notification (Original + Requisito Lab) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cartToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">¡Acción exitosa!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // URLs de Firebase
        const BASE_URL = "https://prueba-d8054-default-rtdb.firebaseio.com";
        const PRODUCTOS_URL = `${BASE_URL}/productos.json`;
        const CARRITO_URL = `${BASE_URL}/carrito.json`;
        const ORDENES_URL = `${BASE_URL}/ordenes.json`;

        // El arreglo estático ahora comienza vacío y se llena con Firebase
        let products = [];
        let cart = []; 
        
        // Elementos del DOM
        const productsContainer = document.getElementById("productsContainer");
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const cartList = document.getElementById("cartList");
        const cartTotal = document.getElementById("cartTotal");
        const clearCartBtn = document.getElementById("clearCartBtn");
        const formProducto = document.getElementById("formProducto");
        const btnFinalizarCompra = document.getElementById("btnFinalizarCompra");
        const spinner = document.getElementById("loadingSpinner");

        // Funciones UX (Spinners y Toasts)
        function toggleSpinner(show) {
            show ? spinner.classList.remove('d-none') : spinner.classList.add('d-none');
        }

        function showToast(message, colorClass = "text-bg-success") {
            const toastEl = document.getElementById('cartToast');
            toastEl.className = `toast align-items-center border-0 ${colorClass}`;
            document.getElementById('toastMessage').textContent = message;
            new bootstrap.Toast(toastEl).show();
        }

        // ==========================================
        // 1. MÓDULO ADMINISTRADOR & CATÁLOGO (CRUD)
        // ==========================================

        // CREATE: Enviar nuevo producto a Firebase
        formProducto.addEventListener('submit', async (e) => {
            e.preventDefault();
            toggleSpinner(true);
            const nuevoProducto = {
                name: document.getElementById('prodNombre').value,
                price: parseFloat(document.getElementById('prodPrecio').value),
                category: document.getElementById('prodCategoria').value,
                stock: parseInt(document.getElementById('prodStock').value)
            };
            try {
                await fetch(PRODUCTOS_URL, { method: 'POST', body: JSON.stringify(nuevoProducto) });
                showToast("Producto registrado en la base de datos");
                formProducto.reset();
                cargarCatalogo(); // Recargar el catálogo
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        });

        // READ: Obtener catálogo desde Firebase
        async function cargarCatalogo() {
            toggleSpinner(true);
            try {
                const res = await fetch(PRODUCTOS_URL);
                const data = await res.json();
                products = []; // Limpiar arreglo local
                if(data) {
                    // Convertir el objeto de Firebase a un arreglo para mantener tu lógica de filtros
                    for(let id in data) {
                        products.push({ id_fb: id, ...data[id] });
                    }
                }
                applyFilters(); // Renderiza usando tus filtros originales
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        }

        // RENDER: Dibujar las tarjetas (Modificado para usar ID de Firebase y botón eliminar)
        function renderProducts(items) {
            productsContainer.innerHTML = "";
            if (items.length === 0) {
                productsContainer.innerHTML = "<p class='text-muted'>No hay productos disponibles.</p>";
                return;
            }
            items.forEach(product => {
                const productCard = document.createElement("article");
                productCard.className = "card p-3 shadow-sm"; 
                productCard.style.width = "18rem";
                productCard.innerHTML = `
                  <h3 class="card-title fs-5">${product.name}</h3>
                  <p class="card-text mb-1">Categoría: ${product.category}</p>
                  <p class="card-text mb-1 small text-muted">Stock: ${product.stock || 0}</p>
                  <p class="card-text fw-bold">Precio: $${parseFloat(product.price).toFixed(2)}</p>
                  <div class="mt-auto pt-2 d-flex justify-content-between">
                      <button class="btn btn-primary btn-sm" onclick="addToCart('${product.id_fb}')">Agregar</button>
                      <button class="btn btn-outline-danger btn-sm" onclick="eliminarProducto('${product.id_fb}')">Eliminar</button>
                  </div>
                `;
                productsContainer.appendChild(productCard);
            });
        }

        // DELETE: Eliminar producto de Firebase (Requisito Lab)
        async function eliminarProducto(id_fb) {
            if(!confirm("¿Eliminar este producto permanentemente?")) return;
            toggleSpinner(true);
            try {
                await fetch(`${BASE_URL}/productos/${id_fb}.json`, { method: 'DELETE' });
                showToast("Producto eliminado del catálogo", "text-bg-danger");
                cargarCatalogo();
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        }

        // ==========================================
        // 2. MÓDULO DE COMERCIO (Carrito y Checkout)
        // ==========================================

        // Sincronizar adición al carrito con Firebase
        async function addToCart(productId_fb) {
            const product = products.find(p => p.id_fb === productId_fb);
            if (product) {
                toggleSpinner(true);
                try {
                    // Guardar en /carrito.json
                    await fetch(CARRITO_URL, { method: 'POST', body: JSON.stringify(product) });
                    showToast(`¡${product.name} guardado en la nube!`);
                    obtenerCarritoNube();
                } catch(e) { console.error(e); }
                toggleSpinner(false);
            }
        }

        // Leer el carrito desde Firebase y renderizar
        async function obtenerCarritoNube() {
            try {
                const res = await fetch(CARRITO_URL);
                const data = await res.json();
                cart = []; // Reiniciar local
                if(data) {
                    for(let id in data) {
                        cart.push({ id_fb: id, ...data[id] });
                    }
                }
                updateCart(); // Tu función original de renderizado de carrito
            } catch(e) { console.error(e); }
        }

        // Renderizar HTML del carrito (Adaptado a IDs de Firebase)
        function updateCart() {
            cartList.innerHTML = "";
            if (cart.length === 0) {
                cartList.innerHTML = "<li class='list-group-item'>El carrito está vacío</li>";
                cartTotal.textContent = "0.00";
                return;
            }
            let total = 0;
            cart.forEach((item) => {
                const precioNum = parseFloat(item.price) || 0;
                total += precioNum;
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.innerHTML = `
                    <span>${item.name} - $${precioNum.toFixed(2)}</span>
                    <button class="btn btn-sm btn-danger" onclick="removeFromCart('${item.id_fb}')">Quitar</button>
                `;
                cartList.appendChild(li);
            });
            cartTotal.textContent = total.toFixed(2);
        }

        // Eliminar item específico del carrito en Firebase
        async function removeFromCart(id_fb_carrito) {
            toggleSpinner(true);
            try {
                await fetch(`${BASE_URL}/carrito/${id_fb_carrito}.json`, { method: 'DELETE' });
                obtenerCarritoNube();
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        }

        // Vaciar TODO el carrito en Firebase
        clearCartBtn.addEventListener("click", async () => {
            toggleSpinner(true);
            try {
                await fetch(CARRITO_URL, { method: 'DELETE' });
                showToast("Carrito vaciado", "text-bg-warning");
                obtenerCarritoNube();
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        });

        // Checkout: Generar Orden y Vaciar Carrito (Requisito Lab)
        btnFinalizarCompra.addEventListener("click", async () => {
            if(cart.length === 0) {
                showToast("El carrito está vacío", "text-bg-danger");
                return;
            }
            toggleSpinner(true);
            try {
                let total = cart.reduce((acc, curr) => acc + parseFloat(curr.price || 0), 0);
                const nuevaOrden = {
                    fecha: new Date().toISOString(),
                    items: cart,
                    montoTotal: total
                };
                
                // 1. Guardar la orden en /ordenes.json
                await fetch(ORDENES_URL, { method: 'POST', body: JSON.stringify(nuevaOrden) });
                
                // 2. Vaciar el carrito en /carrito.json
                await fetch(CARRITO_URL, { method: 'DELETE' });

                showToast("¡Orden procesada exitosamente! Carrito limpio.", "text-bg-primary");
                obtenerCarritoNube(); // Actualiza la vista
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        });

        // ==========================================
        // 3. FILTROS LOCALES (Tu lógica original intacta)
        // ==========================================
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCategory = categoryFilter.value;

            const filteredProducts = products.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(searchTerm) || product.category.toLowerCase().includes(searchTerm);
                const matchesCategory = selectedCategory === "Todos" || product.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });
            renderProducts(filteredProducts);
        }

        searchInput.addEventListener("input", applyFilters);
        categoryFilter.addEventListener("change", applyFilters);
        
        // ==========================================
        // INICIO DE LA APLICACIÓN
        // ==========================================
        cargarCatalogo();     // Cargar productos de Firebase en vez del array estático
        obtenerCarritoNube(); // Cargar carrito guardado en Firebase

    </script>
</body>
</html>
