<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Catálogo Profesional</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important;
        }
        .hero-banner {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            border-radius: 0 0 20px 20px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .sticky-cart {
            position: sticky;
            top: 20px;
        }
        .admin-panel {
            border-left: 5px solid #0d6efd;
        }
    </style>
</head>
<body class="bg-light pb-5"> 
    
    <header class="hero-banner mb-5 text-center">
        <h1 class="display-4 fw-bold"><i class="bi bi-cpu"></i> TechStore Catalog</h1>
        <p class="lead">Encuentra los mejores componentes y accesorios para tu setup profesional.</p>
    </header>

    <main class="container-fluid px-4 px-md-5">
        
        <div class="text-center">
            <div id="loadingSpinner" class="spinner-border text-primary d-none mb-4" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>

        <div class="accordion shadow-sm mb-5" id="accordionAdmin">
            <div class="accordion-item admin-panel">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed fw-bold text-primary" type="button" data-bs-toggle="collapse" data-bs-target="#adminPanel">
                        <i class="bi bi-gear-fill me-2"></i> Panel de Administrador (Gestión e Inventario)
                    </button>
                </h2>
                <div id="adminPanel" class="accordion-collapse collapse" data-bs-parent="#accordionAdmin">
                    <div class="accordion-body bg-white row">
                        <div class="col-md-8">
                            <h5 class="mb-3"><i class="bi bi-plus-circle"></i> Alta de Nuevos Productos</h5>
                            <form id="formProducto" class="row g-3">
                                <div class="col-md-4"><input type="text" id="prodNombre" class="form-control" placeholder="Nombre del producto" required></div>
                                <div class="col-md-3"><input type="number" id="prodPrecio" step="0.01" class="form-control" placeholder="Precio ($)" required></div>
                                <div class="col-md-3">
                                    <select id="prodCategoria" class="form-select" required>
                                        <option value="" disabled selected>Categoría...</option>
                                        <option value="Periféricos">Periféricos</option>
                                        <option value="Pantallas">Pantallas</option>
                                        <option value="Audio">Audio</option>
                                        <option value="Accesorios">Accesorios</option>
                                    </select>
                                </div>
                                <div class="col-md-2"><input type="number" id="prodStock" class="form-control" placeholder="Stock" required></div>
                                <div class="col-md-9"><input type="url" id="prodImagen" class="form-control" placeholder="URL de la imagen (Ej. https://...)" required></div>
                                <div class="col-md-3"><button type="submit" class="btn btn-primary w-100 fw-bold"><i class="bi bi-cloud-arrow-up"></i> Guardar</button></div>
                            </form>
                        </div>
                        <div class="col-md-4 border-start text-center">
                            <h6 class="text-muted"><i class="bi bi-pie-chart-fill"></i> Stock por Categoría</h6>
                            <canvas id="stockChart" style="max-height: 200px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            
            <div class="col-lg-8 col-xl-9">
                <section class="p-3 border rounded bg-white shadow-sm mb-4 d-flex flex-wrap align-items-center gap-3">
                    <div class="flex-grow-1">
                        <label for="searchInput" class="fw-bold text-muted small"><i class="bi bi-search"></i> Buscar producto:</label>
                        <input type="text" id="searchInput" placeholder="Ej. Teclado, Monitor..." class="form-control bg-light">
                    </div>
                    <div>
                        <label for="categoryFilter" class="fw-bold text-muted small"><i class="bi bi-funnel"></i> Categoría:</label>
                        <select id="categoryFilter" class="form-select bg-light w-auto">
                            <option value="Todos">Todas las categorías</option>
                            <option value="Periféricos">Periféricos</option>
                            <option value="Pantallas">Pantallas</option>
                            <option value="Audio">Audio</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                    </div>
                </section>
                
                <section>
                    <h3 class="fw-bold mb-3"><i class="bi bi-box-seam"></i> Catálogo Disponible</h3>
                    <div id="productsContainer" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
                    </div>
                </section>
            </div>

            <div class="col-lg-4 col-xl-3">
                <section class="p-4 border rounded bg-white shadow-lg sticky-cart">
                    <h4 class="fw-bold text-center mb-4"><i class="bi bi-cart4 text-primary fs-2"></i><br>Tu Orden</h4>
                    
                    <ul id="cartList" class="list-group list-group-flush mb-4">
                        <li class="list-group-item text-center text-muted">El carrito está vacío</li>
                    </ul>
                    
                    <div class="bg-light p-3 rounded text-center mb-3 border">
                        <span class="text-muted small">Total a pagar</span>
                        <h2 class="fw-bold text-success m-0">$<span id="cartTotal">0.00</span></h2>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button id="btnFinalizarCompra" class="btn btn-success btn-lg fw-bold shadow-sm">
                            <i class="bi bi-credit-card"></i> Finalizar Compra
                        </button>
                        <button id="clearCartBtn" class="btn btn-outline-danger shadow-sm">
                            <i class="bi bi-trash"></i> Vaciar Carrito
                        </button>
                    </div>
                </section>
            </div>

        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-4">
        <div id="cartToast" class="toast align-items-center border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold text-white fs-6" id="toastMessage">
                    <i class="bi bi-info-circle me-2"></i> ¡Acción exitosa!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const BASE_URL = "https://techstore-web-786c8-default-rtdb.firebaseio.com"; 
        
        const PRODUCTOS_URL = `${BASE_URL}/productos.json`;
        const CARRITO_URL = `${BASE_URL}/carrito.json`;
        const ORDENES_URL = `${BASE_URL}/ordenes.json`;

        let products = [];
        let cart = []; 
        let miGrafico = null; 
        
        const productsContainer = document.getElementById("productsContainer");
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const cartList = document.getElementById("cartList");
        const cartTotal = document.getElementById("cartTotal");
        const formProducto = document.getElementById("formProducto");
        const spinner = document.getElementById("loadingSpinner");

        function toggleSpinner(show) {
            show ? spinner.classList.remove('d-none') : spinner.classList.add('d-none');
        }

        function showToast(message, colorClass = "bg-success") {
            const toastEl = document.getElementById('cartToast');
            toastEl.className = `toast align-items-center border-0 rounded-3 ${colorClass}`;
            document.getElementById('toastMessage').innerHTML = `<i class="bi bi-check-circle me-2"></i> ${message}`;
            new bootstrap.Toast(toastEl).show();
        }

        function actualizarGrafica() {
            const ctx = document.getElementById('stockChart').getContext('2d');
            
            const categoriasCount = {};
            products.forEach(p => {
                const cat = p.category || 'Otros';
                categoriasCount[cat] = (categoriasCount[cat] || 0) + parseInt(p.stock || 0);
            });

            if (miGrafico) miGrafico.destroy();

            miGrafico = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categoriasCount),
                    datasets: [{
                        data: Object.values(categoriasCount),
                        backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6c757d'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12 } }
                    }
                }
            });
        }

        formProducto.addEventListener('submit', async (e) => {
            e.preventDefault();
            toggleSpinner(true);
            const nuevoProducto = {
                name: document.getElementById('prodNombre').value,
                price: parseFloat(document.getElementById('prodPrecio').value),
                category: document.getElementById('prodCategoria').value,
                stock: parseInt(document.getElementById('prodStock').value),
                imagen: document.getElementById('prodImagen').value
            };
            try {
                await fetch(PRODUCTOS_URL, { method: 'POST', body: JSON.stringify(nuevoProducto) });
                showToast("Producto creado exitosamente");
                formProducto.reset();
                cargarCatalogo(); 
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        });

        async function cargarCatalogo() {
            toggleSpinner(true);
            try {
                const res = await fetch(PRODUCTOS_URL);
                const data = await res.json();
                products = []; 
                if(data) {
                    for(let id in data) {
                        products.push({ id_fb: id, ...data[id] });
                    }
                }
                applyFilters(); 
                actualizarGrafica(); 
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        }

        function renderProducts(items) {
            productsContainer.innerHTML = "";
            if (items.length === 0) {
                productsContainer.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-box-seam text-muted" style="font-size: 4rem;"></i>
                        <p class="text-muted mt-3 fs-5">No hay productos que coincidan con la búsqueda.</p>
                    </div>`;
                return;
            }
            items.forEach(product => {
                const imgUrl = product.imagen || 'https://via.placeholder.com/300x200?text=Sin+Imagen';
                
                const colDiv = document.createElement("div");
                colDiv.className = "col";
                colDiv.innerHTML = `
                <article class="card card-hover h-100 shadow-sm border-0">
                    <div class="position-relative">
                        <img src="${imgUrl}" class="card-img-top p-3" style="height:220px; object-fit:contain;" alt="Producto">
                        <span class="position-absolute top-0 end-0 mt-3 me-3 badge rounded-pill bg-primary shadow-sm">${product.category || 'Sin Categoría'}</span>
                    </div>
                    <div class="card-body d-flex flex-column bg-light rounded-bottom">
                        <h5 class="card-title fw-bold text-dark">${product.name || 'Sin Nombre'}</h5>
                        <p class="card-text mb-1 text-muted small"><i class="bi bi-boxes"></i> Stock: ${product.stock || 0}</p>
                        <h3 class="card-text fw-bold text-success mb-3">$${parseFloat(product.price || 0).toFixed(2)}</h3>
                        <div class="mt-auto d-flex justify-content-between gap-2">
                            <button class="btn btn-primary flex-grow-1 fw-bold" onclick="addToCart('${product.id_fb}')">
                                <i class="bi bi-cart-plus"></i> Añadir
                            </button>
                            <button class="btn btn-outline-danger px-3" onclick="eliminarProducto('${product.id_fb}')" title="Eliminar producto">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </article>
                `;
                productsContainer.appendChild(colDiv);
            });
        }

        async function eliminarProducto(id_fb) {
            if(!confirm("¿Estás seguro de eliminar este producto permanentemente?")) return;
            toggleSpinner(true);
            try {
                await fetch(`${BASE_URL}/productos/${id_fb}.json`, { method: 'DELETE' });
                showToast("Producto eliminado de la base de datos", "bg-danger");
                cargarCatalogo();
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        }

        async function addToCart(productId_fb) {
            const product = products.find(p => p.id_fb === productId_fb);
            
            if (product) {
                // Validación extra: No dejar comprar si no hay stock
                if (product.stock <= 0) {
                    showToast("¡Este producto está agotado!", "bg-danger");
                    return;
                }

                toggleSpinner(true);
                try {
                    await fetch(CARRITO_URL, { method: 'POST', body: JSON.stringify(product) });
                    const nuevoStock = product.stock - 1;
                    await fetch(`${BASE_URL}/productos/${productId_fb}.json`, { 
                        method: 'PATCH', 
                        body: JSON.stringify({ stock: nuevoStock }) 
                    });

                    showToast(`¡${product.name} añadido al carrito!`, "bg-success");
                    obtenerCarritoNube(); 
                    cargarCatalogo(); 

                } catch(e) { console.error(e); }
                toggleSpinner(false);
            }
        }

        async function obtenerCarritoNube() {
            try {
                const res = await fetch(CARRITO_URL);
                const data = await res.json();
                cart = []; 
                if(data) {
                    for(let id in data) {
                        cart.push({ id_fb_carrito: id, ...data[id] });
                    }
                }
                updateCart(); 
            } catch(e) { console.error(e); }
        }

        function updateCart() {
            cartList.innerHTML = "";
            if (cart.length === 0) {
                cartList.innerHTML = "<li class='list-group-item text-center text-muted border-0 bg-transparent'><i class='bi bi-cart-x fs-1 d-block mb-2'></i>El carrito está vacío</li>";
                cartTotal.textContent = "0.00";
                return;
            }
            let total = 0;
            cart.forEach((item) => {
                const precioNum = parseFloat(item.price) || 0;
                total += precioNum;
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center bg-transparent px-0";
                li.innerHTML = `
                    <div class="me-auto">
                        <div class="fw-bold text-truncate" style="max-width: 150px;" title="${item.name}">${item.name || 'Producto'}</div>
                        <span class="text-success fw-bold">$${precioNum.toFixed(2)}</span>
                    </div>
                    <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="removeFromCart('${item.id_fb_carrito}')">
                        <i class="bi bi-x-lg"></i>
                    </button>
                `;
                cartList.appendChild(li);
            });
            cartTotal.textContent = total.toFixed(2);
        }

        async function removeFromCart(id_fb_carrito) {
            toggleSpinner(true);
            try {
                await fetch(`${BASE_URL}/carrito/${id_fb_carrito}.json`, { method: 'DELETE' });
                obtenerCarritoNube();
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        }

        document.getElementById("clearCartBtn").addEventListener("click", async () => {
            if (cart.length === 0) return;
            toggleSpinner(true);
            try {
                await fetch(CARRITO_URL, { method: 'DELETE' });
                showToast("Carrito vaciado", "bg-warning text-dark");
                obtenerCarritoNube();
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        });

        document.getElementById("btnFinalizarCompra").addEventListener("click", async () => {
            if(cart.length === 0) {
                showToast("El carrito está vacío, no se puede comprar.", "bg-danger");
                return;
            }
            toggleSpinner(true);
            try {
                let total = cart.reduce((acc, curr) => acc + parseFloat(curr.price || 0), 0);
                
                const nuevaOrden = {
                    fecha: new Date().toISOString(),
                    items: cart,
                    montoTotal: total
                };
                await fetch(ORDENES_URL, { method: 'POST', body: JSON.stringify(nuevaOrden) });
                await fetch(CARRITO_URL, { method: 'DELETE' });

                showToast("¡Compra procesada con éxito! Generando orden...", "bg-primary");
                obtenerCarritoNube(); 
            } catch(e) { console.error(e); }
            toggleSpinner(false);
        });

        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCategory = categoryFilter.value;

            const filteredProducts = products.filter(product => {
                const nombreSeguro = (product.name || "").toLowerCase();
                const categoriaSegura = (product.category || "").toLowerCase();

                const matchesSearch = nombreSeguro.includes(searchTerm) || categoriaSegura.includes(searchTerm);
                const matchesCategory = selectedCategory === "Todos" || product.category === selectedCategory;
                
                return matchesSearch && matchesCategory;
            });
            renderProducts(filteredProducts);
        }

        searchInput.addEventListener("input", applyFilters);
        categoryFilter.addEventListener("change", applyFilters);
        
        cargarCatalogo();     
        obtenerCarritoNube(); 

    </script>
</body>
</html>
