<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Weather | Exclusive Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos de Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
        }

        /* Animaciones fluidas para el fondo */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        /* Efectos de Cristal (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }
        .glass-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, background 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-white flex items-center justify-center p-4 relative overflow-hidden selection:bg-cyan-500 selection:text-white">

    <!-- Elementos Decorativos de Fondo (Blobs) -->
    <div class="absolute top-0 left-10 w-72 h-72 bg-purple-600 rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-blob"></div>
    <div class="absolute top-0 right-10 w-72 h-72 bg-cyan-500 rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-1/2 w-72 h-72 bg-blue-600 rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-blob animation-delay-4000"></div>

    <!-- Contenedor Principal (Glass Panel) -->
    <main class="relative z-10 w-full max-w-4xl glass-panel rounded-[2.5rem] p-8 md:p-12 transition-all duration-500">
        
        <!-- Header y Buscador -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-12 border-b border-white/10 pb-8">
            <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start">
                <div class="bg-gradient-to-br from-cyan-400 to-blue-600 p-2 rounded-xl shadow-lg shadow-cyan-500/30">
                    <i class="ph-bold ph-cloud-lightning text-3xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">NEXUS<span class="text-cyan-400">WEATHER</span></h1>
                </div>
            </div>
            
            <!-- Buscador elegante -->
            <form id="formClima" class="w-full md:w-80 relative group">
                <i class="ph ph-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 text-xl group-focus-within:text-cyan-400 transition-colors"></i>
                <input type="text" id="inputCiudad" class="w-full pl-14 pr-12 py-4 rounded-full bg-black/20 border border-white/10 text-white focus:outline-none focus:border-cyan-400 focus:bg-black/40 transition-all placeholder-slate-500 shadow-inner text-sm font-medium tracking-wide" placeholder="Buscar ciudad, ej. Madrid..." required>
                <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/10 hover:bg-cyan-500 text-white p-2.5 rounded-full transition-all duration-300 hover:shadow-[0_0_15px_rgba(34,211,238,0.5)]">
                    <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>
        </header>

        <!-- ESTADO: Error -->
        <div id="alertaError" class="hidden bg-red-500/10 border border-red-500/30 text-red-200 p-5 rounded-2xl flex items-center gap-4 mb-8">
            <div class="bg-red-500/20 p-2 rounded-full"><i class="ph-fill ph-warning-circle text-2xl text-red-400"></i></div>
            <p id="textoError" class="font-medium text-sm">No se encontró la ciudad.</p>
        </div>

        <!-- ESTADO: Cargando (Radar animado) -->
        <div id="cargando" class="hidden flex flex-col items-center justify-center py-16">
            <div class="relative flex justify-center items-center w-24 h-24">
                <div class="absolute inset-0 border-4 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin"></div>
                <div class="absolute inset-2 border-4 border-purple-500/20 border-b-purple-400 rounded-full animate-spin-slow"></div>
                <i class="ph-fill ph-planet text-3xl text-cyan-400"></i>
            </div>
            <p class="mt-6 text-cyan-400 font-semibold tracking-[0.2em] text-sm animate-pulse">Sincronizando satélite...</p>
        </div>

        <!-- ESTADO: Éxito (Dashboard) -->
        <div id="tarjetaClima" class="hidden opacity-0 transition-opacity duration-700">
            <div class="flex flex-col lg:flex-row items-center lg:items-stretch gap-8 lg:gap-12">
                
                <!-- Columna Izquierda: Info Principal -->
                <div class="flex-1 flex flex-col justify-center text-center lg:text-left w-full">
                    <div class="mb-6">
                        <h2 id="nombreCiudad" class="text-5xl md:text-6xl font-extrabold text-white tracking-tight mb-2 drop-shadow-lg">--</h2>
                        <div class="flex items-center justify-center lg:justify-start gap-2 text-cyan-400">
                            <i class="ph-fill ph-map-pin"></i>
                            <p id="paisCiudad" class="text-lg font-medium tracking-wide">--</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-center lg:justify-start gap-6 mb-6 mt-4">
                        <i id="iconoClima" class="ph-fill ph-cloud-sun text-8xl md:text-9xl text-white drop-shadow-[0_0_30px_rgba(255,255,255,0.2)]"></i>
                        <div class="flex flex-col items-start leading-none">
                            <div class="flex">
                                <span class="text-8xl md:text-9xl font-black tracking-tighter" id="temperatura">--</span>
                                <span class="text-4xl md:text-5xl font-light text-cyan-400 mt-2">°</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="inline-block bg-white/5 border border-white/10 rounded-full px-6 py-2 backdrop-blur-md self-center lg:self-start">
                        <p id="descClima" class="text-lg text-slate-200 font-medium capitalize tracking-wide">--</p>
                    </div>
                </div>

                <!-- Columna Derecha: Tarjetas de Detalles (Grid Inteligente) -->
                <div class="w-full lg:w-[45%] grid grid-cols-2 gap-4">
                    
                    <!-- Humedad -->
                    <div class="glass-card rounded-3xl p-6 flex flex-col items-center justify-center text-center group">
                        <div class="bg-blue-500/10 p-3 rounded-2xl mb-4 group-hover:scale-110 transition-transform">
                            <i class="ph-fill ph-drop text-3xl text-blue-400"></i>
                        </div>
                        <span id="humedad" class="text-3xl font-bold text-white mb-1">--%</span>
                        <span class="text-slate-400 text-xs font-semibold uppercase tracking-widest">Humedad</span>
                    </div>
                    
                    <!-- Viento -->
                    <div class="glass-card rounded-3xl p-6 flex flex-col items-center justify-center text-center group">
                        <div class="bg-teal-500/10 p-3 rounded-2xl mb-4 group-hover:scale-110 transition-transform">
                            <i class="ph-fill ph-wind text-3xl text-teal-400"></i>
                        </div>
                        <span id="viento" class="text-3xl font-bold text-white mb-1">--<span class="text-sm font-normal text-slate-400 ml-1">km/h</span></span>
                        <span class="text-slate-400 text-xs font-semibold uppercase tracking-widest">Viento</span>
                    </div>
                    
                    <!-- Sensación Térmica (Ocupa las dos columnas) -->
                    <div class="glass-card col-span-2 rounded-3xl p-6 flex flex-row items-center justify-between px-8 group">
                        <div class="flex items-center gap-4">
                            <div class="bg-orange-500/10 p-3 rounded-2xl group-hover:scale-110 transition-transform">
                                <i class="ph-fill ph-thermometer-hot text-3xl text-orange-400"></i>
                            </div>
                            <div class="text-left">
                                <span class="block text-slate-400 text-xs font-semibold uppercase tracking-widest mb-1">Sensación Térmica</span>
                                <span class="text-sm text-slate-500">Lo que el cuerpo percibe</span>
                            </div>
                        </div>
                        <span id="sensacion" class="text-4xl font-black text-white">--°</span>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const formClima = document.getElementById('formClima');
        const inputCiudad = document.getElementById('inputCiudad');
        
        const tarjetaClima = document.getElementById('tarjetaClima');
        const cargando = document.getElementById('cargando');
        const alertaError = document.getElementById('alertaError');
        const textoError = document.getElementById('textoError');

        function interpretarClima(codigo) {
            const climas = {
                0: { texto: "Cielo Despejado", icono: "ph-fill ph-sun text-yellow-400 drop-shadow-[0_0_20px_rgba(250,204,21,0.5)]" },
                1: { texto: "Mayormente Despejado", icono: "ph-fill ph-cloud-sun text-yellow-300" },
                2: { texto: "Parcialmente Nublado", icono: "ph-fill ph-cloud-sun text-slate-200" },
                3: { texto: "Nublado", icono: "ph-fill ph-cloud text-slate-300 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]" },
                45: { texto: "Niebla", icono: "ph-fill ph-cloud-fog text-slate-400" },
                48: { texto: "Niebla escarchada", icono: "ph-fill ph-cloud-fog text-slate-300" },
                51: { texto: "Llovizna Ligera", icono: "ph-fill ph-cloud-rain text-blue-300" },
                53: { texto: "Llovizna Moderada", icono: "ph-fill ph-cloud-rain text-blue-400" },
                55: { texto: "Llovizna Densa", icono: "ph-fill ph-cloud-rain text-blue-500" },
                61: { texto: "Lluvia Ligera", icono: "ph-fill ph-cloud-rain text-blue-400" },
                63: { texto: "Lluvia Moderada", icono: "ph-fill ph-cloud-rain text-blue-500 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]" },
                65: { texto: "Lluvia Fuerte", icono: "ph-fill ph-cloud-rain text-blue-600" },
                71: { texto: "Nieve Ligera", icono: "ph-fill ph-snowflake text-cyan-200" },
                73: { texto: "Nieve Moderada", icono: "ph-fill ph-snowflake text-cyan-300 drop-shadow-[0_0_15px_rgba(103,232,249,0.5)]" },
                75: { texto: "Nieve Fuerte", icono: "ph-fill ph-snowflake text-cyan-400" },
                95: { texto: "Tormenta Eléctrica", icono: "ph-fill ph-cloud-lightning text-purple-400 drop-shadow-[0_0_20px_rgba(192,132,252,0.6)]" },
                96: { texto: "Tormenta con Granizo", icono: "ph-fill ph-cloud-lightning text-purple-500" },
                99: { texto: "Tormenta Severa", icono: "ph-fill ph-cloud-lightning text-purple-600" }
            };
            return climas[codigo] || { texto: "Clima Variable", icono: "ph-fill ph-cloud text-slate-400" };
        }

        function mostrarEstado(estado, mensajeError = "") {
            tarjetaClima.classList.add('hidden');
            tarjetaClima.classList.remove('opacity-100');
            cargando.classList.add('hidden');
            alertaError.classList.add('hidden');

            if (estado === 'cargando') {
                cargando.classList.remove('hidden');
            } else if (estado === 'exito') {
                tarjetaClima.classList.remove('hidden');
                setTimeout(() => tarjetaClima.classList.add('opacity-100'), 50);
            } else if (estado === 'error') {
                alertaError.classList.remove('hidden');
                textoError.textContent = mensajeError;
            }
        }

        async function consultarClima(ciudadABuscar) {
            mostrarEstado('cargando');

            try {
                // 1. Geocodificación
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(ciudadABuscar)}&count=1&language=es&format=json`;
                const resGeo = await fetch(geoUrl);
                if (!resGeo.ok) throw new Error("Error de conexión al servidor GPS.");
                
                const dataGeo = await resGeo.json();
                if (!dataGeo.results || dataGeo.results.length === 0) {
                    throw new Error(`No se encontró la ciudad "${ciudadABuscar}". Intenta nuevamente.`);
                }

                const ciudad = dataGeo.results[0];
                
                // 2. Consulta de Clima
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${ciudad.latitude}&longitude=${ciudad.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&timezone=auto`;
                const resWeather = await fetch(weatherUrl);
                if (!resWeather.ok) throw new Error("Error al procesar datos meteorológicos.");
                
                const dataWeather = await resWeather.json();
                const climaActual = dataWeather.current;
                const infoClima = interpretarClima(climaActual.weather_code);

                // 3. Inyección en el DOM y Limpieza de textos
                document.getElementById('nombreCiudad').textContent = ciudad.name;
                
                // Lógica elegante: Si el país y la ciudad se llaman igual (Guatemala, Guatemala), no lo repetimos.
                const countryText = ciudad.country || "";
                document.getElementById('paisCiudad').textContent = (countryText && countryText.toLowerCase() !== ciudad.name.toLowerCase()) 
                    ? countryText 
                    : "Ubicación Confirmada";
                
                document.getElementById('temperatura').textContent = Math.round(climaActual.temperature_2m);
                document.getElementById('humedad').textContent = `${climaActual.relative_humidity_2m}%`;
                document.getElementById('viento').textContent = `${climaActual.wind_speed_10m}`;
                document.getElementById('sensacion').textContent = `${Math.round(climaActual.apparent_temperature)}°`;
                
                document.getElementById('descClima').textContent = infoClima.texto;
                document.getElementById('iconoClima').className = infoClima.icono;

                mostrarEstado('exito');

            } catch (error) {
                console.error(error);
                mostrarEstado('error', error.message);
            }
        }

        formClima.addEventListener('submit', (e) => {
            e.preventDefault();
            const ciudadIngresada = inputCiudad.value.trim();
            if (ciudadIngresada) consultarClima(ciudadIngresada);
        });

        // Buscar tu ubicación por defecto al iniciar
        window.addEventListener('DOMContentLoaded', () => {
            inputCiudad.value = "Totonicapán";
            consultarClima("Totonicapán");
        });
    </script>
</body>
</html>
